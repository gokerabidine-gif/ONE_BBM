name: Build ONE BBM Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare project source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q "ONE-BBM-upload-light.zip" -d source
          PROJECT_DIR="$(find source -type f -name package.json -not -path '*/node_modules/*' -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "package.json was not found inside the uploaded archive" >&2
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project directory: $PROJECT_DIR"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found" >&2
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Apply mobile startup safeguards
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('src/main.js')
          s = main.read_text()
          old = """const config = createConfig({
  quality: explicitQ ?? (wantsUltra ? 'ultra' : detectTier()),
  deterministic: capture,
});"""
          new = old + """
// Android WebView has a tighter GPU-memory budget than desktop browsers.
const isAndroidMobile = /Android/i.test(navigator.userAgent);
if (isAndroidMobile) {
  Object.assign(config.q, {
    renderScale: 0.55,
    shadowMapSize: 512,
    cascades: 1,
    shadowDistance: 55,
    drawDistance: 650,
    streamRadius: 120,
    particleBudget: 700,
    decalBudget: 24,
    anisotropy: 2,
    trafficBudget: 4,
    pedBudget: 6,
  });
}"""
          if old not in s:
              raise SystemExit('Could not find createConfig block in src/main.js')
          s = s.replace(old, new, 1)
          old_warm = "const warmup = params.get('prewarm') === '0' ? { ok: false, reason: 'disabled by ?prewarm=0' } : await prewarm(engine);"
          new_warm = "const warmup = (isAndroidMobile || params.get('prewarm') === '0') ? { ok: false, reason: isAndroidMobile ? 'disabled on Android to reduce startup GPU pressure' : 'disabled by ?prewarm=0' } : await prewarm(engine);"
          if old_warm not in s:
              raise SystemExit('Could not find prewarm startup line in src/main.js')
          main.write_text(s.replace(old_warm, new_warm, 1))

          render = Path('src/render/index.js')
          r = render.read_text()
          old_pr = "const pr = Math.min(globalThis.devicePixelRatio || 1, 1.5);"
          new_pr = "const pr = Math.min(globalThis.devicePixelRatio || 1, /Android/i.test(navigator.userAgent) ? 1 : 1.5);"
          if old_pr not in r:
              raise SystemExit('Could not find renderer pixel-ratio line')
          render.write_text(r.replace(old_pr, new_pr, 1))
          print('Applied Android low-memory startup profile and skipped shader prewarm on Android.')
          PY

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --no-audit --no-fund

      - name: Validate and build web game
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm run lint --if-present
          npm run build

      - name: Generate Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap add android

      - name: Sync web assets
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Lock app to landscape
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          m = re.search(r'<activity\b[^>]*>', s, re.S)
          if not m:
              raise SystemExit('Main activity not found in AndroidManifest.xml')
          tag = re.sub(r'\s+android:screenOrientation="[^"]*"', '', m.group(0))
          tag = tag[:-1] + ' android:screenOrientation="landscape">'
          p.write_text(s[:m.start()] + tag + s[m.end():])
          PY

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ONE-BBM-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
