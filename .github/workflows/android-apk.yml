name: Build ONE BBM Android APK
run-name: ONE BBM V6 — Empty-city RP foundation

env:
  ONE_BBM_VERSION: V6

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'fix/player-movement-and-visual-quality']

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare project source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q "ONE-BBM-upload-light-latest.zip" -d source
          PROJECT_DIR="$(find source -type f -name package.json -not -path '*/node_modules/*' -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "package.json was not found inside the uploaded archive" >&2
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project directory: $PROJECT_DIR"

      - name: Export extracted project source for inspection
        shell: bash
        run: |
          set -euo pipefail
          zip -qr ONE-BBM-extracted-source.zip "$PROJECT_DIR"
      - name: Upload extracted project source
        uses: actions/upload-artifact@v4
        with:
          name: ONE-BBM-V6-source
          path: ONE-BBM-extracted-source.zip
          if-no-files-found: error
          retention-days: 7

      - name: Export character model source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p character-model-source
          if [ ! -f man-base-character.fbx.txt ]; then
            echo "Character FBX file is missing from repository" >&2
            exit 1
          fi
          cp man-base-character.fbx.txt character-model-source/man-base-character-static.fbx
          cp man-base-character.fbx.txt.zip character-model-source/man-base-character-static.fbx.zip
          # Grab3D's separate rigged variant is CC0; download for skeleton/skin inspection.
          if curl -L --fail --retry 2 --silent --show-error "https://grab3d.com/dl/man-base-character-rigged/man-base-character-rigged.fbx" -o character-model-source/man-base-character-rigged.fbx; then
            echo "Rigged FBX downloaded"
          else
            echo "Warning: rigged FBX download failed"
          fi
          if curl -L --fail --retry 2 --silent --show-error "https://grab3d.com/dl/man-base-character-rigged/man-base-character-rigged.glb" -o character-model-source/man-base-character-rigged.glb; then
            echo "Rigged GLB downloaded"
          else
            echo "Warning: rigged GLB download failed"
          fi
          zip -qr ONE-BBM-character-model-source.zip character-model-source

      - name: Upload character model source
        uses: actions/upload-artifact@v4
        with:
          name: ONE-BBM-V6-character-model
          path: ONE-BBM-character-model-source.zip
          if-no-files-found: error
          retention-days: 7

      - name: Activate realistic player character replacement
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/activate_real_character.py "$PROJECT_DIR" "$GITHUB_WORKSPACE/character-model-source/man-base-character-rigged.glb"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found" >&2
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Apply Phase 8 slide button layout
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/ui/touch.js')
          lines = p.read_text().splitlines()
          lines = [line for line in lines if line.strip() != "const row3 = el('div', 'ow-trow', this.btns);" and line.strip() != "this.bSlide = this._button(row3, 'slide', 'SLIDE', 'slide');"]
          aim = "    this.bAim = this._button(row1, 'aim', 'AIM', 'aim');"
          slide = "    this.bSlide = this._button(row1, 'slide', 'SLIDE', 'slide');"
          if slide not in lines:
              try:
                  lines.insert(lines.index(aim) + 1, slide)
              except ValueError:
                  raise SystemExit('AIM button line not found')
          lines = [line.replace('// btn row + fire row + the gap between them, from the stylesheet.', '// Two control rows (slide is beside AIM) + their gap, from the stylesheet.') for line in lines]
          p.write_text("\n".join(lines) + "\n")
          print('Phase 8 slide button layout applied')
          PY

      - name: Apply Android quality and frame-pacing fixes
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/core/governor.js')
          s = p.read_text()
          expected = "constructor({ targetMs = 16.7, slowMs = 23, fastMs = 11, allowTierChange = true } = {}) {"
          if expected not in s:
              raise SystemExit('Governor constructor signature changed unexpectedly')
          s = s.replace("    this.minScale = 0.84;\n", """    // Dynamic resolution must be available below the medium preset too.
            this.minScale = 0.62;
          """, 1)
          old = "    const cfg = engine.config;\n    const render = engine.ctx?.peek?.('render');"
          new = """    const cfg = engine.config;
            const presetScale = QUALITY_PRESETS[cfg.quality]?.renderScale ?? 0.8;
            this.minScale = Math.max(0.62, Math.min(0.84, presetScale * 0.82));
            const render = engine.ctx?.peek?.('render');"""
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Governor update insertion point missing')
          s = s.replace("    engine.resize?.();\n    engine.events?.emit?.('resize', { width: innerWidth, height: innerHeight });\n", """    // Engine.resize() already emits the resize event after systems rebuild.
            // Emitting again resized event-driven targets twice and added hitches.
            engine.resize?.();
          """, 1)
          start = s.find("    if (/iPhone|iPad|Android/i.test(navigator.userAgent)) return 'low';")
          end = s.find("    const bigCanvas = px > 3.0e6;", start)
          if start < 0 or end < 0:
              if "const ua = String(navigator.userAgent || '')" not in s:
                  raise SystemExit('Android tier detection block missing')
          else:
              mobile_block = """    const ua = String(navigator.userAgent || '');
              // Keep entry-level phones at low, but do not force capable Android
              // hardware into the lowest geometry, traffic and lighting budgets.
              if (/Android/i.test(ua)) {
                const memory = Number(navigator.deviceMemory || 0);
                const cores = Number(navigator.hardwareConcurrency || 0);
                const capableGpu = /Mali-G[567]|Adreno \\(TM\\) 7|Adreno 7/i.test(r);
                return (capableGpu || (memory >= 8 && cores >= 8)) ? 'medium' : 'low';
              }
              if (/iPhone|iPad/i.test(ua)) return 'low';
              // Retina at 3.3 MP internal is a very different job from 1080p.
              const px = innerWidth * innerHeight * Math.min(devicePixelRatio || 1, 2);
          """
              s = s[:start] + mobile_block + s[end:]
          p.write_text(s)
          main = Path('src/main.js')
          ms = main.read_text()
          old_call = "  const gov = new Governor({ allowTierChange: !explicitQ });"
          new_call = """  const mobileDevice = /Android|iPhone|iPad/i.test(navigator.userAgent || '');
            const gov = new Governor({ allowTierChange: !explicitQ, slowMs: mobileDevice ? 17.8 : 23, fastMs: mobileDevice ? 14 : 11 });"""
          if old_call in ms:
              ms = ms.replace(old_call, new_call, 1)
          elif "slowMs: mobileDevice ? 17.8" not in ms:
              raise SystemExit('Governor boot call changed unexpectedly')
          main.write_text(ms)
          pkg = Path('package.json')
          ps = pkg.read_text()
          old_build = '"build": "node tools/lintticks.mjs && vite build"'
          new_build = '"build": "node src/core/tierprobe.mjs && node tools/lintticks.mjs && vite build"'
          if old_build in ps:
              ps = ps.replace(old_build, new_build, 1)
          elif 'node src/core/tierprobe.mjs' not in ps:
              raise SystemExit('package build script changed unexpectedly')
          pkg.write_text(ps)
          Path('src/core/tierprobe.mjs').write_text("""import assert from 'node:assert/strict';
          import { detectTier, Governor } from './governor.js';
          const saved = Object.fromEntries(['document','navigator','innerWidth','innerHeight','devicePixelRatio'].map(k => [k, Object.getOwnPropertyDescriptor(globalThis,k)]));
          function mock({ua,memory=0,cores=0,renderer=''}) {
            globalThis.document = { createElement: () => ({ getContext: () => ({ getExtension: () => ({UNMASKED_RENDERER_WEBGL:37445}), getParameter: () => renderer }) }) };
            Object.defineProperty(globalThis,'navigator',{configurable:true,value:{userAgent:ua,deviceMemory:memory,hardwareConcurrency:cores}});
            globalThis.innerWidth=1080; globalThis.innerHeight=2400; globalThis.devicePixelRatio=2;
          }
          try {
            mock({ua:'Android 14',memory:8,cores:8}); assert.equal(detectTier(),'medium');
            mock({ua:'Android 12',memory:4,cores:4}); assert.equal(detectTier(),'low');
            mock({ua:'Android 14',renderer:'Mali-G615 MC6'}); assert.equal(detectTier(),'medium');
            mock({ua:'Windows',renderer:'NVIDIA RTX 4060'}); globalThis.devicePixelRatio=1; assert.equal(detectTier(),'high');
            const g=new Governor({slowMs:17.8,fastMs:14}); let n=0; g._apply({resize:()=>n++,events:{emit:()=>n++}});
            assert.equal(n,1); assert.equal(g.slowMs,17.8);
            console.log('Mobile tier detection + governor resize path: PASS');
          } finally {
            for (const [k,d] of Object.entries(saved)) { if(d) Object.defineProperty(globalThis,k,d); else delete globalThis[k]; }
          }
          """)
          print('Android quality/frame-pacing fixes applied')
          PY

      - name: Apply V2 in-game visual detail upgrade
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          quality = Path('src/buildings/quality.js')
          s = quality.read_text()
          if 'export function facadeLodScale' not in s:
              s += """
          /**
           * Per-building LOD compensation. Keeps facade bands readable slightly
           * farther away without increasing the streamed city radius.
           */
          export function facadeLodScale(quality) {
            if (quality === 'ultra') return 1.16;
            if (quality === 'high') return 1.12;
            if (quality === 'medium') return 1.08;
            return 1.03;
          }
          """
          quality.write_text(s)

          p = Path('src/buildings/index.js')
          s = p.read_text()
          old = "import { farFacadeDetailDistance } from './quality.js';"
          new = "import { farFacadeDetailDistance, facadeLodScale } from './quality.js';"
          if old in s: s = s.replace(old, new, 1)
          elif new not in s: raise SystemExit('Buildings quality import not found')
          old = "        lodDistance: this.farDetailDist,\\n        lodCenter: [rec.cx, this._groundAt(rec.cx, rec.cz) + 10, rec.cz],"
          new = "        lodDistance: this.farDetailDist,\\n        lodScale: facadeLodScale(this.ctx.config.quality),\\n        lodCenter: [rec.cx, this._groundAt(rec.cx, rec.cz) + 10, rec.cz]"
          if old in s: s = s.replace(old, new, 1)
          elif 'lodScale: facadeLodScale(this.ctx.config.quality)' not in s:
              raise SystemExit('Building tile LOD options not found')
          p.write_text(s)

          p = Path('src/buildings/tile.js')
          s = p.read_text()
          old = "      lodNode.name = `bl_${this.name}`;\\n      lodNode.autoUpdate = false;\\n      const near = new THREE.Group();"
          new = "      lodNode.name = `bl_${this.name}`;\\n      lodNode.autoUpdate = false;\\n      lodNode.userData.owLodScale = Math.max(1, Math.min(1.2, Number(opts.lodScale) || 1));\\n      const near = new THREE.Group();"
          if old in s: s = s.replace(old, new, 1)
          elif 'lodNode.userData.owLodScale' not in s:
              raise SystemExit('TileBuilder LOD node insertion point not found')
          p.write_text(s)

          p = Path('src/buildings/qualityprobe.mjs')
          s = p.read_text()
          s = s.replace("import { farFacadeDetailDistance } from './quality.js';",
                        "import { farFacadeDetailDistance, facadeLodScale } from './quality.js';")
          if 'facadeLodScale(\'medium\')' not in s:
              s += """
          assert.equal(facadeLodScale('low'), 1.03);
          assert.equal(facadeLodScale('medium'), 1.08);
          assert.equal(facadeLodScale('high'), 1.12);
          assert.equal(facadeLodScale('ultra'), 1.16);
          console.log('facade LOD scale probe: 4 assertions passed');
          """
          p.write_text(s)

          p = Path('src/player/character/index.js')
          s = p.read_text()
          old = """      extRoot.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; if (o.material) o.material.roughness = Math.max(0.58, o.material.roughness ?? 0.7); } });"""
          new = """      const renderSystem = this.ctx.peek?.('render');
                const maxAnisotropy = Math.max(1, Math.min(8, renderSystem?.renderer?.capabilities?.getMaxAnisotropy?.() ?? 1));
                extRoot.traverse(o => {
                  if (!o.isMesh) return;
                  o.castShadow = true;
                  o.receiveShadow = true;
                  const materials = Array.isArray(o.material) ? o.material : [o.material];
                  for (const material of materials) {
                    if (!material) continue;
                    material.roughness = Math.max(0.58, material.roughness ?? 0.7);
                    for (const slot of ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'aoMap']) {
                      const texture = material[slot];
                      if (!texture) continue;
                      texture.anisotropy = maxAnisotropy;
                      texture.needsUpdate = true;
                    }
                  }
                });"""
          if old in s: s = s.replace(old, new, 1)
          elif 'const maxAnisotropy = Math.max(1, Math.min(8' not in s:
              raise SystemExit('Realistic character material block not found')
          p.write_text(s)

          p = Path('package.json')
          raw = p.read_text()
          if raw.endswith(chr(92) + 'n'): raw = raw[:-2]
          pkg = json.loads(raw)
          probe = 'node src/buildings/qualityprobe.mjs'
          if probe not in pkg['scripts']['build']:
              pkg['scripts']['build'] = pkg['scripts']['build'].replace(' && vite build', f' && {probe} && vite build')
          p.write_text(json.dumps(pkg, indent=2) + chr(10))
          print('ONE BBM V2 in-game visual detail upgrade applied')
          PY

      - name: Correct facade LOD threshold direction
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          quality = Path('src/buildings/quality.js')
          s = quality.read_text()
          s, n = re.subn(
              r"export function facadeLodScale\(quality\) \{.*?\n\}",
              """export function facadeLodScale(quality) {
            // cull.js divides the LOD threshold by this value. Values below
            // one therefore keep high-detail facade bands visible farther away.
            if (quality === 'ultra') return 1 / 1.16;
            if (quality === 'high') return 1 / 1.12;
            if (quality === 'medium') return 1 / 1.08;
            return 1 / 1.03;
          }""",
              s, count=1, flags=re.S
          )
          if n != 1:
              raise SystemExit('Could not locate facadeLodScale implementation')
          quality.write_text(s)

          tile = Path('src/buildings/tile.js')
          s = tile.read_text()
          old = "Math.max(1, Math.min(1.2, Number(opts.lodScale) || 1))"
          new = "Math.max(0.84, Math.min(1, Number(opts.lodScale) || 1))"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Unexpected facade LOD scale clamp')
          tile.write_text(s)

          probe = Path('src/buildings/qualityprobe.mjs')
          s = probe.read_text()
          s = re.sub(
              r"assert\.equal\(facadeLodScale\('low'\),.*?console\.log\('facade LOD scale probe: 4 assertions passed'\);",
              """assert.ok(Math.abs(facadeLodScale('low') * 1.03 - 1) < 1e-10);
          assert.ok(Math.abs(facadeLodScale('medium') * 1.08 - 1) < 1e-10);
          assert.ok(Math.abs(facadeLodScale('high') * 1.12 - 1) < 1e-10);
          assert.ok(Math.abs(facadeLodScale('ultra') * 1.16 - 1) < 1e-10);
          assert.ok(facadeLodScale('ultra') < facadeLodScale('low'));
          console.log('facade LOD direction probe: 5 assertions passed');""",
              s, count=1, flags=re.S
          )
          if 'facade LOD direction probe: 5 assertions passed' not in s:
              raise SystemExit('Could not update facade LOD assertions')
          probe.write_text(s)
          print('ONE BBM V3 corrected facade LOD threshold direction')
          PY

      - name: Stop distant skyline roads blocking first entry
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/world/index.js')
          s = p.read_text()
          init_anchor = "    this._sectorJobs = 0;\n"
          if "this._farPending = 0;" not in s:
              if init_anchor not in s:
                  raise SystemExit('World streaming initialization anchor missing')
              s = s.replace(init_anchor, init_anchor + "    // Horizon-only road ribbons must not hold the player at the loading screen.\n    this._farPending = 0;\n", 1)
          ready_old = "      this.queue.pending === 0 && this._sectorJobs === 0 && this._colJobs === 0 &&"
          ready_new = "      this.queue.pending <= this._farPending && this._sectorJobs === 0 && this._colJobs === 0 &&"
          if ready_old in s:
              s = s.replace(ready_old, ready_new, 1)
          elif ready_new not in s:
              raise SystemExit('World ready gate anchor missing')
          method_start = s.find("  _queueFarSectors() {")
          if method_start < 0:
              raise SystemExit('Actual _queueFarSectors method missing')
          method_end = s.find("\n  /*", method_start)
          if method_end < 0:
              raise SystemExit('Could not locate end of _queueFarSectors method')
          method = s[method_start:method_end]
          if "this._farPending++;" not in method:
              lines = method.splitlines()
              push_i = next((i for i, line in enumerate(lines) if "this.queue.push(() => {" in line), -1)
              if push_i < 0:
                  raise SystemExit('Far-sector queue push not found')
              indent = lines[push_i][:len(lines[push_i]) - len(lines[push_i].lstrip())]
              close_i = next((i for i in range(push_i + 1, len(lines)) if lines[i].strip() == "}, 6);"), -1)
              if close_i < 0:
                  raise SystemExit('Far-sector queue callback terminator not found')
              body = lines[push_i + 1:close_i]
              wrapped = [indent + "this._farPending++;",
                         indent + "this.queue.push(() => {",
                         indent + "  try {"]
              wrapped.extend(("    " + line if line.strip() else line) for line in body)
              wrapped.extend([indent + "  } finally {",
                              indent + "    this._farPending = Math.max(0, this._farPending - 1);",
                              indent + "  }",
                              indent + "}, 6);"])
              lines[push_i:close_i + 1] = wrapped
              method = "\n".join(lines)
          # Normalize escaped line breaks left by earlier patch attempts, even when the counter already exists.
          method = method.replace("\\n", "\n")
          s = s[:method_start] + method + s[method_end:]
          # Full streamingIdle remains strict: captures still wait for every horizon ribbon.
          if "this.queue.pending === 0 &&" not in s:
              raise SystemExit('Strict streamingIdle gate unexpectedly changed')
          p.write_text(s)
          probe = Path('src/world/worldreadinessprobe.mjs')
          probe.write_text("""import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const s = await readFile(new URL('./index.js', import.meta.url), 'utf8');
          assert.match(s, /this\\._farPending = 0/);
          assert.match(s, /this\\.queue\\.pending <= this\\._farPending/);
          assert.match(s, /this\\._farPending\\+\\+/);
          assert.match(s, /this\\._farPending = Math\\.max\\(0, this\\._farPending - 1\\)/);
          assert.match(s, /streamingIdle\\(\\)[\\s\\S]*?this\\.queue\\.pending === 0/);
          console.log('World readiness gate: horizon work no longer blocks initial entry; strict full-idle gate preserved.');
          """)
          print('Distant horizon work separated from initial world-ready gate')
          PY
          node src/world/worldreadinessprobe.mjs

      - name: Apply mobile thermal and startup budget
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('src/main.js')
          s = main.read_text()
          config_anchor = "  deterministic: capture,\n});\nif (capture) {"
          mobile_block = """  deterministic: capture,
          });
          const mobileDevice = /Android|iPhone|iPad/i.test(navigator.userAgent || '');
          // A balanced mobile profile: retain the city silhouette and facade
          // detail while cutting the expensive resident radius, shadow passes,
          // crowd/traffic density and post effects that drive heat and frame drops.
          if (mobileDevice && !explicitQ) Object.assign(config.q, {
            renderScale: 0.74, shadowMapSize: 1024, cascades: 2, shadowDistance: 100,
            taa: false, gtao: false, ssr: false, volumetrics: false, motionBlur: false,
            bloom: true, anisotropy: 4, particleBudget: 2400, decalBudget: 72,
            drawDistance: 1300, streamRadius: 240, tileBuildBudgetMs: 3,
            lightSlots: 4, trafficBudget: 10, pedBudget: 24, lodBias: 1.65,
            grassDensity: 0.30,
          });
          if (capture) {"""
          if config_anchor in s:
              s=s.replace(config_anchor,mobile_block,1)
          elif "A balanced mobile profile:" not in s:
              raise SystemExit("main config insertion anchor missing")
          s=s.replace("await prewarm(engine);","await prewarm(engine, { mobile: mobileDevice });",1)
          s=s.replace("  const mobileDevice = /Android|iPhone|iPad/i.test(navigator.userAgent || '');\n  const gov = new Governor({ allowTierChange: !explicitQ, slowMs: mobileDevice ? 17.8 : 23, fastMs: mobileDevice ? 14 : 11 });",
                      "  const gov = new Governor({ allowTierChange: !explicitQ, slowMs: mobileDevice ? 19.5 : 23, fastMs: mobileDevice ? 14.5 : 11 });",1)
          if "await prewarm(engine, { mobile: mobileDevice });" not in s:
              raise SystemExit("prewarm call replacement failed")
          main.write_text(s)

          warm = Path('src/core/prewarm.js')
          s = warm.read_text()
          sig = "export async function prewarm(engine, { onProgress = () => {}, transients = false, drawFrames = false } = {}) {"
          newsig = "export async function prewarm(engine, { onProgress = () => {}, transients = false, drawFrames = false, mobile = false } = {}) {"
          if sig in s: s=s.replace(sig,newsig,1)
          elif newsig not in s: raise SystemExit("prewarm signature anchor missing")
          s=s.replace("  const programsBefore = renderer.info.programs?.length ?? 0;",
                      "  const programsBefore = renderer.info.programs?.length ?? 0;\n  // Mobile devices compile one representative spawn view; the world/material hooks below still warm the shared shader variants.\n  const warmPoses = mobile ? WARM_POSES.slice(0, 1) : WARM_POSES;",1)
          s=s.replace("const totalSteps = WARM_POSES.length * 2 + (transients ? transientStages.length : 0) + 1;",
                      "const totalSteps = warmPoses.length * 2 + (transients ? transientStages.length : 0) + 1;",1)
          s=s.replace("for (const p of WARM_POSES) {","for (const p of warmPoses) {",1)
          if "const warmPoses = mobile ? WARM_POSES.slice(0, 1) : WARM_POSES;" not in s:
              raise SystemExit("mobile warm pose insertion failed")
          warm.write_text(s)
          print("Mobile thermal profile and reduced startup shader prewarm applied")
          PY

      - name: V6 remove all NPC and retain vehicles
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          # The RP foundation is an explicitly empty-city mode: cars and the
          # player remain, while ambient pedestrians, companions, mission
          # hostiles, and police actors are disabled at their owning systems.
          main = Path('src/main.js')
          ms = main.read_text()
          marker = "if (capture) {"
          if "config.q.pedBudget = 0; // ONE BBM V6" not in ms:
              if marker not in ms:
                  raise SystemExit('main config marker missing')
              ms = ms.replace(marker, "          config.q.pedBudget = 0; // ONE BBM V6: no NPC population; vehicles remain enabled.\n          " + marker, 1)
          main.write_text(ms)

          p = Path('src/peds/index.js')
          s = p.read_text()
          old = "    this.budget = Math.max(4, this.q.pedBudget ?? 40);"
          new = "    this.noNpc = this.q.pedBudget === 0;\n    this.budget = this.noNpc ? 0 : Math.max(4, this.q.pedBudget ?? 40);"
          if old in s: s = s.replace(old, new, 1)
          elif "this.noNpc = this.q.pedBudget === 0;" not in s: raise SystemExit('ped budget anchor missing')
          s = s.replace("    this.ambientBodies = Math.max(6, Math.min(38, Math.round(this.budget * 0.36)));",
                        "    this.ambientBodies = this.noNpc ? 0 : Math.max(6, Math.min(38, Math.round(this.budget * 0.36)));", 1)
          s = s.replace("    this.maxBodies = this.ambientBodies + CREW_MAX + HOSTILE_BODIES;",
                        "    this.maxBodies = this.noNpc ? 0 : this.ambientBodies + CREW_MAX + HOSTILE_BODIES;", 1)
          s = s.replace("    this.crewAuto = true;          // spawn them as soon as there is a player",
                        "    this.crewAuto = !this.noNpc;   // V6 RP: never spawn companion NPCs in the empty city", 1)
          s = s.replace("    for (const id of SHAPE_IDS) this._variant(id);",
                        "    if (!this.noNpc) for (const id of SHAPE_IDS) this._variant(id);", 1)
          s = s.replace("    const w = this.world;\n    let district = null;",
                        "    if (this.noNpc) return 0;\n    const w = this.world;\n    let district = null;", 1)
          s = s.replace("  spawnHostile(position, opts) {\n    return this.hostiles.spawn(position, opts);",
                        "  spawnHostile(position, opts) {\n    if (this.noNpc) return null;\n    return this.hostiles.spawn(position, opts);", 1)
          s = s.replace("  spawnCrew(ids = null) {\n    this.crewAuto = ids === null;",
                        "  spawnCrew(ids = null) {\n    if (this.noNpc) return 0;\n    this.crewAuto = ids === null;", 1)
          s = s.replace("  attachDriver(vehicle, seat = 0, opts = {}) {\n    const ped = this._freePed();",
                        "  attachDriver(vehicle, seat = 0, opts = {}) {\n    if (this.noNpc) return null; // keep traffic vehicles, but leave every seat empty\n    const ped = this._freePed();", 1)
          s = s.replace("  _crewStream(dt) {\n", "  _crewStream(dt) {\n    if (this.noNpc) return;\n", 1)
          update_anchor = "  update(dt, ctx) {\n    const t0 = performance.now();"
          update_new = "  update(dt, ctx) {\n    if (this.noNpc) { this.stats.live = 0; this.stats.target = 0; this.stats.crew = 0; this.stats.ms = 0; return; }\n    const t0 = performance.now();"
          if update_anchor in s: s=s.replace(update_anchor, update_new, 1)
          elif "if (this.noNpc) { this.stats.live = 0;" not in s: raise SystemExit('PedSystem update anchor missing')
          required = ["this.noNpc = this.q.pedBudget === 0;", "if (this.noNpc) return 0;", "if (this.noNpc) return null;", "if (this.noNpc) return;"]
          for token in required:
              if token not in s: raise SystemExit('NPC guard missing: ' + token)
          p.write_text(s)

          police = Path('src/police/index.js')
          s = police.read_text()
          s = s.replace("  spawnCop(crooked = false, opts = {}) {",
                        "  spawnCop(crooked = false, opts = {}) {\n    if (this.ctx?.config?.q?.pedBudget === 0) return null; // V6 empty-city RP", 1)
          s = s.replace("  update(dt, ctx) {\n    if (this._staged) {",
                        "  update(dt, ctx) {\n    if (ctx?.config?.q?.pedBudget === 0) return; // V6: no police NPC simulation\n    if (this._staged) {", 1)
          if "V6 empty-city RP" not in s or "no police NPC simulation" not in s:
              raise SystemExit('Police NPC guards were not applied')
          police.write_text(s)

          # A build-time regression gate: zero NPC budget must stay wired to
          # the ambient, crew, hostile, driver and police creation paths.
          Path('src/peds/rpemptyprobe.mjs').write_text("""import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const [main,peds,police] = await Promise.all([
            readFile(new URL('../main.js', import.meta.url),'utf8'),
            readFile(new URL('./index.js', import.meta.url),'utf8'),
            readFile(new URL('../police/index.js', import.meta.url),'utf8')
          ]);
          assert.match(main,/config\\.q\\.pedBudget = 0; \\/\\/ ONE BBM V6/);
          assert.match(peds,/this\\.noNpc = this\\.q\\.pedBudget === 0/);
          assert.match(peds,/if \\(this\\.noNpc\\) return null; \\/\\/ keep traffic vehicles/);
          assert.match(peds,/if \\(this\\.noNpc\\) return 0/);
          assert.match(peds,/if \\(this\\.noNpc\\) \\{ this\\.stats\\.live = 0/);
          assert.match(police,/no police NPC simulation/);
          assert.match(police,/V6 empty-city RP/);
          console.log('V6 empty-city NPC suppression probe: 7 assertions passed');
          """)
          pkg = Path('package.json')
          data = json.loads(pkg.read_text())
          build = data['scripts']['build']
          gate = 'node src/peds/rpemptyprobe.mjs'
          if gate not in build:
              data['scripts']['build'] = build.replace(' && vite build', f' && {gate} && vite build')
          pkg.write_text(json.dumps(data, indent=2) + '\n')
          print('V6 empty-city RP: all NPC creation paths disabled; vehicle systems untouched')
          PY

      - name: Persist tuned Android source archive
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          zip -qr "$GITHUB_WORKSPACE/ONE-BBM-upload-light-latest.zip" .
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ONE-BBM-upload-light-latest.zip
          if ! git diff --cached --quiet; then
            git commit -m "Persist Android quality and frame pacing tuning"
            git push origin "$GITHUB_REF_NAME"
            echo "Tuned source archive committed"
          else
            echo "Source archive already contains tuning"
          fi

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --no-audit --no-fund

      - name: Validate and build web game
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm run lint --if-present
          npm run build

      - name: Runtime-smoke-test realistic player model in Chromium
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          npx playwright install chromium
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/onebbm-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true; echo "=== preview log ==="; cat /tmp/onebbm-preview.log' EXIT
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true, args: ['--use-gl=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist'] });
          const page = await browser.newPage();
          const errors = [];
          page.on('pageerror', e => errors.push(e.message));
          page.on('console', m => { if (m.type() === 'error') errors.push(m.text()); });
          try {
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.waitForFunction(() => window.__READY__ === true, null, { timeout: 90000 });
            await page.waitForFunction(() => ['loaded', 'failed'].includes(window.__ONE_BBM_CHARACTER_MODEL__?.status), null, { timeout: 45000 });
          } catch (e) {
            console.log('Runtime wait failed:', e.message);
          }
          const status = await page.evaluate(() => ({ ready: window.__READY__, model: window.__ONE_BBM_CHARACTER_MODEL__ ?? null }));
          console.log('Runtime diagnostics:', JSON.stringify(status));
          console.log('Browser errors:', JSON.stringify(errors.slice(0, 30)));
          await page.screenshot({ path: 'onebbm-runtime.png', fullPage: false, animations: 'disabled', timeout: 10000 }).catch(e => console.log('Screenshot error:', e.message));
          if (status.model?.status !== 'loaded' || (status.model?.bones ?? 0) < 15) {
            throw new Error('Model runtime verification failed; diagnostics logged above');
          }
          console.log('Realistic character model runtime smoke test PASSED');
          await browser.close();
          JS

      - name: Upload runtime screenshot for visual inspection
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ONE-BBM-V6-runtime-test
          path: ${{ env.PROJECT_DIR }}/onebbm-runtime.png
          if-no-files-found: error
          retention-days: 7

      - name: Generate Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap add android

      - name: Sync web assets
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Lock app to landscape
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          m = re.search(r'<activity\b[^>]*>', s, re.S)
          if not m:
              raise SystemExit('Main activity not found in AndroidManifest.xml')
          tag = re.sub(r'\s+android:screenOrientation="[^"]*"', '', m.group(0))
          tag = tag[:-1] + ' android:screenOrientation="landscape">'
          p.write_text(s[:m.start()] + tag + s[m.end():])
          PY

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: ./gradlew assembleDebug

      - name: Name versioned APK
        shell: bash
        run: |
          set -euo pipefail
          cp "$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/ONE-BBM-${ONE_BBM_VERSION}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ONE-BBM-V6-APK
          path: ONE-BBM-${{ env.ONE_BBM_VERSION }}.apk
          if-no-files-found: error
          retention-days: 14
