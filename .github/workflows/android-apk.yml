                          "  startRace(trackId) {\n    void trackId;\n    return null; // V9 RP: no scripted race events.\n    const t = RACE_TRACKS[trackId];")
          fs = fs.replace("    for (const t of Object.values(RACE_TRACKS)) {\n      out.push({ x: t.points[0].x, z: t.points[0].z, kind: 'race', name: t.name });\n    }",
                          "    // V9 RP: race activity pins removed.")
          free.write_text(fs)
          Path('src/game/rpmissionremovalprobe.mjs').write_text("""import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const [g,f] = await Promise.all([readFile(new URL('./index.js',import.meta.url),'utf8'),readFile(new URL('./freeroam.js',import.meta.url),'utf8')]);
