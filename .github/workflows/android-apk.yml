name: Build ONE BBM Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare project source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q "ONE-BBM-upload-light.zip" -d source
          PROJECT_DIR="$(find source -type f -name package.json -not -path '*/node_modules/*' -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "package.json was not found inside the uploaded archive" >&2
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project directory: $PROJECT_DIR"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found" >&2
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Apply mobile startup safeguards
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main.js')
          s = p.read_text()
          anchor = "const canvas = document.getElementById('game');"
          mobile = "if (/Android/i.test(navigator.userAgent)) Object.assign(config.q, { renderScale: 0.55, shadowMapSize: 512, cascades: 1, shadowDistance: 55, drawDistance: 650, streamRadius: 120, particleBudget: 700, decalBudget: 24, anisotropy: 2, trafficBudget: 4, pedBudget: 6 });\n\n"
          if anchor not in s:
              raise SystemExit('main.js config insertion point missing')
          s = s.replace(anchor, mobile + anchor, 1)
          old = "const warmup = params.get('prewarm') === '0' ? { ok: false, reason: 'disabled by ?prewarm=0' } : await prewarm(engine);"
          new = "const isAndroidMobile = /Android/i.test(navigator.userAgent);\nconst warmup = (isAndroidMobile || params.get('prewarm') === '0') ? { ok: false, reason: 'disabled for Android/mobile startup' } : await prewarm(engine);"
          if old not in s:
              raise SystemExit('main.js prewarm line missing')
          p.write_text(s.replace(old, new, 1))
          p = Path('src/render/index.js')
          s = p.read_text()
          old = "const pr = Math.min(globalThis.devicePixelRatio || 1, 1.5);"
          new = "const pr = Math.min(globalThis.devicePixelRatio || 1, /Android/i.test(navigator.userAgent) ? 1 : 1.5);"
          if old not in s:
              raise SystemExit('renderer pixel ratio line missing')
          p.write_text(s.replace(old, new, 1))
          print('Android startup safeguards applied')
          PY

      - name: Apply Phase 8 slide button layout
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/ui/touch.js')
          s = p.read_text()
          old = "    const row2 = el('div', 'ow-trow', this.btns);\\n    const row3 = el('div', 'ow-trow', this.btns);\\n\\n    this.bAim = this._button(row1, 'aim', 'AIM', 'aim');\\n    this.bWep = this._button(row1, 'wep', 'WEP', 'wep');"
          new = "    const row2 = el('div', 'ow-trow', this.btns);\\n\\n    this.bAim = this._button(row1, 'aim', 'AIM', 'aim');\\n    this.bSlide = this._button(row1, 'slide', 'SLIDE', 'slide');\\n    this.bWep = this._button(row1, 'wep', 'WEP', 'wep');"
          if old in s:
              s = s.replace(old, new, 1)
          elif "this.bSlide = this._button(row1, 'slide', 'SLIDE', 'slide');" not in s:
              raise SystemExit('Phase 8 control layout patch did not match source')
          old2 = "    this.bFire = this._button(row2, 'fire', 'FIRE', 'fire');\\n    this.bSlide = this._button(row3, 'slide', 'SLIDE', 'slide');"
          if old2 in s:
              s = s.replace(old2, "    this.bFire = this._button(row2, 'fire', 'FIRE', 'fire');", 1)
          s = s.replace('    // btn row + fire row + the gap between them, from the stylesheet.\\n', '    // Two control rows (slide is beside AIM) + their gap, from the stylesheet.\\n', 1)
          p.write_text(s)
          print('Phase 8 slide button layout applied')
          PY

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --no-audit --no-fund

      - name: Validate and build web game
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm run lint --if-present
          npm run build

      - name: Generate Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap add android

      - name: Sync web assets
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Lock app to landscape
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          m = re.search(r'<activity\b[^>]*>', s, re.S)
          if not m:
              raise SystemExit('Main activity not found in AndroidManifest.xml')
          tag = re.sub(r'\s+android:screenOrientation="[^"]*"', '', m.group(0))
          tag = tag[:-1] + ' android:screenOrientation="landscape">'
          p.write_text(s[:m.start()] + tag + s[m.end():])
          PY

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ONE-BBM-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
