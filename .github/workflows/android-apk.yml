      - name: Apply V10 thermal and frame-budget profile for Android
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          main=Path('src/main.js'); s=main.read_text()
          old="""if (mobileDevice && !explicitQ) Object.assign(config.q, {
            renderScale: 0.74, shadowMapSize: 1024, cascades: 2, shadowDistance: 100,
            taa: false, gtao: false, ssr: false, volumetrics: false, motionBlur: false,
            bloom: true, anisotropy: 4, particleBudget: 2400, decalBudget: 72,
            drawDistance: 1300, streamRadius: 240, tileBuildBudgetMs: 3,
            lightSlots: 4, trafficBudget: 10, pedBudget: 24, lodBias: 1.65,
            grassDensity: 0.30,
          });"""
          new="""if (mobileDevice && !explicitQ) Object.assign(config.q, {
            // V10 thermal play profile: sustained stability over visual effects.
            renderScale: 0.52, shadowMapSize: 512, cascades: 1, shadowDistance: 42,
            taa: false, gtao: false, ssr: false, volumetrics: false, motionBlur: false,
            bloom: false, anisotropy: 1, particleBudget: 400, decalBudget: 12,
            drawDistance: 650, streamRadius: 135, tileBuildBudgetMs: 1.5,
            lightSlots: 2, trafficBudget: 3, pedBudget: 0, lodBias: 3.0,
            grassDensity: 0.06,
          });"""
          if old in s: s=s.replace(old,new,1)
          elif 'renderScale: 0.52, shadowMapSize: 512' not in s: raise SystemExit('Mobile profile anchor missing')
          main.write_text(s)

          p=Path('src/core/governor.js'); s=p.read_text()
          import re
          pattern=r"if \(/Android/i\.test\(ua\)\) \{.*?^\s*\}"
          s,n=re.subn(pattern,"if (/Android/i.test(ua)) return 'low'; // V10: prevent tier escalation.",s,flags=re.M|re.S,count=1)
          if n != 1 and "V10: prevent tier escalation" not in s: raise SystemExit('Android tier block not found')
          s=s.replace('this.minScale = 0.62;','this.minScale = 0.48;',1)
          p.write_text(s)

          p=Path('src/render/index.js'); s=p.read_text()
          old="    const pr = Math.min(globalThis.devicePixelRatio || 1, 1.5);"
          new="    const pr = /Android|iPhone|iPad/i.test(navigator.userAgent || '') ? 1 : Math.min(globalThis.devicePixelRatio || 1, 1.5); // V10 thermal profile"
          if old in s: s=s.replace(old,new,1)
          elif 'V10 thermal profile' not in s: raise SystemExit('Pixel ratio line missing')
          p.write_text(s)

          p=Path('src/core/engine.js'); s=p.read_text()
          import re
          loop_pattern=r"  _loop\(now\) \{\n    if \(!this\._running\) return;\n    requestAnimationFrame\(this\._loop\);\n    this\.step\(now\);\n  \}"
          loop_replacement="""  _loop(now) {
            if (!this._running) return;
            requestAnimationFrame(this._loop);
            if (/Android|iPhone|iPad/i.test(navigator.userAgent || '')) {
              const cap = 1000 / 30;
              if (this._mobileLoopLast && now - this._mobileLoopLast < cap) return;
              this._mobileLoopLast = now;
            }
            this.step(now);
          }"""
          s,n=re.subn(loop_pattern,loop_replacement,s,count=1)
          if n != 1 and '_mobileLoopLast' not in s: raise SystemExit('RAF loop anchor not found by regex')
          p.write_text(s)

          p=Path('src/main.js'); s=p.read_text()
          s=s.replace("slowMs: mobileDevice ? 19.5 : 23, fastMs: mobileDevice ? 14.5 : 11",
                      "targetMs: mobileDevice ? 33.3 : 16.7, slowMs: mobileDevice ? 36 : 23, fastMs: mobileDevice ? 25 : 11",1)
          p.write_text(s)

          Path('src/core/v10thermalprobe.mjs').write_text("""import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const [main,gov,render,engine] = await Promise.all([
            readFile(new URL('../main.js',import.meta.url),'utf8'),
            readFile(new URL('./governor.js',import.meta.url),'utf8'),
            readFile(new URL('../render/index.js',import.meta.url),'utf8'),
            readFile(new URL('./engine.js',import.meta.url),'utf8')
          ]);
          assert.ok(main.includes('renderScale: 0.52') && main.includes('trafficBudget: 3') && main.includes('pedBudget: 0'));
          assert.ok(gov.includes('V10: prevent tier escalation') && gov.includes('minScale = 0.48'));
          assert.ok(render.includes('V10 thermal profile') && engine.includes('const cap = 1000 / 30') && engine.includes('_mobileLoopLast'));
          console.log('V10 thermal profile probe: 7 assertions passed');
          """)
          pkg=Path('package.json'); data=json.loads(pkg.read_text())
          gate='node src/core/v10thermalprobe.mjs'
          if gate not in data['scripts']['build']: data['scripts']['build']=data['scripts']['build'].replace(' && vite build',f' && {gate} && vite build')
          pkg.write_text(json.dumps(data,indent=2)+'\\n')
          print('V10 thermal/frame-budget profile applied')
          PY

      - name: Apply V11 staged city streaming and upload throttle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          p = Path('src/world/index.js')
          s = p.read_text()
          # Match both source lines regardless of indentation (workflow YAML
          # strips indentation before this Python executes).
          pattern = r'(?m)^\s*this\._streamTiles\(cx, cz, q\.streamRadius\);\s*\n\s*this\._streamSectors\(cx, cz, Math\.min\(q\.streamRadius, SECTOR_RADIUS_MAX\)\);'
          replacement = """    // V11: start near spawn, then widen the resident city gradually.
          const targetRadius = q.streamRadius;
          if (!this._ready) this._streamRadiusCurrent = Math.min(targetRadius, 60);
          else this._streamRadiusCurrent = Math.min(targetRadius, (this._streamRadiusCurrent ?? 60) + dt * 45);
          const activeRadius = this._streamRadiusCurrent;
          this._streamTiles(cx, cz, activeRadius);
          this._streamSectors(cx, cz, Math.min(activeRadius, SECTOR_RADIUS_MAX));"""
          s, n = re.subn(pattern, replacement, s, count=1)
          if n != 1 and 'V11: start near spawn' not in s:
              raise SystemExit('World streaming call pair not found (regex)')
          p.write_text(s)

          # Reduce geometry handoff bursts. GPU upload happens after attach;
          # count-based ceiling limits the number of new meshes per frame.
          p = Path('src/world/index.js')
          s = p.read_text()
          old = 'const SECTOR_ATTACH_PER_FRAME = 6;'
          new = 'const SECTOR_ATTACH_PER_FRAME = 3; // V11 Android upload pacing'
          if old in s: s = s.replace(old, new, 1)
          elif new not in s: raise SystemExit('Sector attach ceiling anchor missing')
          p.write_text(s)

          Path('src/world/v11streamprobe.mjs').write_text("""import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const s = await readFile(new URL('./index.js', import.meta.url), 'utf8');
          assert.match(s, /V11: start near spawn/);
          assert.ok(s.includes('(_streamRadiusCurrent ?? 60) + dt * 45'));
          assert.ok(s.includes('_streamTiles(cx, cz, activeRadius)'));
          assert.ok(s.includes('_streamSectors(cx, cz, Math.min(activeRadius, SECTOR_RADIUS_MAX))'));
          assert.ok(s.includes('SECTOR_ATTACH_PER_FRAME = 3'));
          console.log('V11 staged streaming and upload pacing probe: 5 assertions passed');
          """)
          pkg = Path('package.json')
          d = json.loads(pkg.read_text())
          gate = 'node src/world/v11streamprobe.mjs'
          if gate not in d['scripts']['build']:
              d['scripts']['build'] = d['scripts']['build'].replace(' && vite build', f' && {gate} && vite build')
          pkg.write_text(json.dumps(d, indent=2) + '\n')
          print('V11 staged streaming and upload pacing applied')
          PY

      - name: Persist tuned Android source archive
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          zip -qr "$GITHUB_WORKSPACE/ONE-BBM-upload-light-latest.zip" .
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ONE-BBM-upload-light-latest.zip
          if ! git diff --cached --quiet; then
            git commit -m "Persist Android quality and frame pacing tuning"
            git push origin "$GITHUB_REF_NAME"
            echo "Tuned source archive committed"
          else
            echo "Source archive already contains tuning"
          fi

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --no-audit --no-fund

      - name: Validate and build web game
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm run lint --if-present
          npm run build

      - name: Runtime-smoke-test realistic player model in Chromium
        if: false # Avoid a hanging model-download smoke test; the APK build remains enabled.
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          npx playwright install chromium
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/onebbm-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true; echo "=== preview log ==="; cat /tmp/onebbm-preview.log' EXIT
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true, args: ['--use-gl=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist'] });
          const page = await browser.newPage();
          const errors = [];
          page.on('pageerror', e => errors.push(e.message));
          page.on('console', m => { if (m.type() === 'error') errors.push(m.text()); });
          try {
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.waitForFunction(() => window.__READY__ === true, null, { timeout: 90000 });
            await page.waitForFunction(() => ['loaded', 'failed'].includes(window.__ONE_BBM_CHARACTER_MODEL__?.status), null, { timeout: 45000 });
          } catch (e) {
            console.log('Runtime wait failed:', e.message);
          }
          const status = await page.evaluate(() => ({ ready: window.__READY__, model: window.__ONE_BBM_CHARACTER_MODEL__ ?? null }));
          console.log('Runtime diagnostics:', JSON.stringify(status));
          console.log('Browser errors:', JSON.stringify(errors.slice(0, 30)));
          await page.screenshot({ path: 'onebbm-runtime.png', fullPage: false, animations: 'disabled', timeout: 10000 }).catch(e => console.log('Screenshot error:', e.message));
          if (status.model?.status !== 'loaded' || (status.model?.bones ?? 0) < 15) {
            throw new Error('Model runtime verification failed; diagnostics logged above');
          }
          console.log('Realistic character model runtime smoke test PASSED');
          await browser.close();
          JS

      - name: Upload runtime screenshot for visual inspection
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ONE-BBM-V6-runtime-test
          path: ${{ env.PROJECT_DIR }}/onebbm-runtime.png
          if-no-files-found: error
          retention-days: 7

      - name: Generate Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap add android

      - name: Sync web assets
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Lock app to landscape
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          m = re.search(r'<activity\b[^>]*>', s, re.S)
          if not m:
              raise SystemExit('Main activity not found in AndroidManifest.xml')
          tag = re.sub(r'\s+android:screenOrientation="[^"]*"', '', m.group(0))
          tag = tag[:-1] + ' android:screenOrientation="landscape">'
          p.write_text(s[:m.start()] + tag + s[m.end():])
          PY

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: ./gradlew assembleDebug

      - name: Name versioned APK
        shell: bash
        run: |
          set -euo pipefail
          cp "$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/ONE-BBM-${ONE_BBM_VERSION}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ONE-BBM-V6-APK
          path: ONE-BBM-${{ env.ONE_BBM_VERSION }}.apk
          if-no-files-found: error
          retention-days: 14
