name: Build ONE BBM Android APK
run-name: ONE BBM V1 — Graphics & FPS

env:
  ONE_BBM_VERSION: V1

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'fix/player-movement-and-visual-quality']

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare project source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q "ONE-BBM-upload-light-latest.zip" -d source
          PROJECT_DIR="$(find source -type f -name package.json -not -path '*/node_modules/*' -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "package.json was not found inside the uploaded archive" >&2
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project directory: $PROJECT_DIR"

      - name: Export extracted project source for inspection
        shell: bash
        run: |
          set -euo pipefail
          zip -qr ONE-BBM-extracted-source.zip "$PROJECT_DIR"
      - name: Upload extracted project source
        uses: actions/upload-artifact@v4
        with:
          name: ONE-BBM-V1-source
          path: ONE-BBM-extracted-source.zip
          if-no-files-found: error
          retention-days: 7

      - name: Export character model source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p character-model-source
          if [ ! -f man-base-character.fbx.txt ]; then
            echo "Character FBX file is missing from repository" >&2
            exit 1
          fi
          cp man-base-character.fbx.txt character-model-source/man-base-character-static.fbx
          cp man-base-character.fbx.txt.zip character-model-source/man-base-character-static.fbx.zip
          # Grab3D's separate rigged variant is CC0; download for skeleton/skin inspection.
          if curl -L --fail --retry 2 --silent --show-error "https://grab3d.com/dl/man-base-character-rigged/man-base-character-rigged.fbx" -o character-model-source/man-base-character-rigged.fbx; then
            echo "Rigged FBX downloaded"
          else
            echo "Warning: rigged FBX download failed"
          fi
          if curl -L --fail --retry 2 --silent --show-error "https://grab3d.com/dl/man-base-character-rigged/man-base-character-rigged.glb" -o character-model-source/man-base-character-rigged.glb; then
            echo "Rigged GLB downloaded"
          else
            echo "Warning: rigged GLB download failed"
          fi
          zip -qr ONE-BBM-character-model-source.zip character-model-source

      - name: Upload character model source
        uses: actions/upload-artifact@v4
        with:
          name: ONE-BBM-V1-character-model
          path: ONE-BBM-character-model-source.zip
          if-no-files-found: error
          retention-days: 7

      - name: Activate realistic player character replacement
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/activate_real_character.py "$PROJECT_DIR" "$GITHUB_WORKSPACE/character-model-source/man-base-character-rigged.glb"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found" >&2
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Apply Phase 8 slide button layout
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/ui/touch.js')
          lines = p.read_text().splitlines()
          lines = [line for line in lines if line.strip() != "const row3 = el('div', 'ow-trow', this.btns);" and line.strip() != "this.bSlide = this._button(row3, 'slide', 'SLIDE', 'slide');"]
          aim = "    this.bAim = this._button(row1, 'aim', 'AIM', 'aim');"
          slide = "    this.bSlide = this._button(row1, 'slide', 'SLIDE', 'slide');"
          if slide not in lines:
              try:
                  lines.insert(lines.index(aim) + 1, slide)
              except ValueError:
                  raise SystemExit('AIM button line not found')
          lines = [line.replace('// btn row + fire row + the gap between them, from the stylesheet.', '// Two control rows (slide is beside AIM) + their gap, from the stylesheet.') for line in lines]
          p.write_text("\n".join(lines) + "\n")
          print('Phase 8 slide button layout applied')
          PY

      - name: Apply Android quality and frame-pacing fixes
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/core/governor.js')
          s = p.read_text()
          expected = "constructor({ targetMs = 16.7, slowMs = 23, fastMs = 11, allowTierChange = true } = {}) {"
          if expected not in s:
              raise SystemExit('Governor constructor signature changed unexpectedly')
          s = s.replace("    this.minScale = 0.84;\n", """    // Dynamic resolution must be available below the medium preset too.
            this.minScale = 0.62;
          """, 1)
          old = "    const cfg = engine.config;\n    const render = engine.ctx?.peek?.('render');"
          new = """    const cfg = engine.config;
            const presetScale = QUALITY_PRESETS[cfg.quality]?.renderScale ?? 0.8;
            this.minScale = Math.max(0.62, Math.min(0.84, presetScale * 0.82));
            const render = engine.ctx?.peek?.('render');"""
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Governor update insertion point missing')
          s = s.replace("    engine.resize?.();\n    engine.events?.emit?.('resize', { width: innerWidth, height: innerHeight });\n", """    // Engine.resize() already emits the resize event after systems rebuild.
            // Emitting again resized event-driven targets twice and added hitches.
            engine.resize?.();
          """, 1)
          start = s.find("    if (/iPhone|iPad|Android/i.test(navigator.userAgent)) return 'low';")
          end = s.find("    const bigCanvas = px > 3.0e6;", start)
          if start < 0 or end < 0:
              if "const ua = String(navigator.userAgent || '')" not in s:
                  raise SystemExit('Android tier detection block missing')
          else:
              mobile_block = """    const ua = String(navigator.userAgent || '');
              // Keep entry-level phones at low, but do not force capable Android
              // hardware into the lowest geometry, traffic and lighting budgets.
              if (/Android/i.test(ua)) {
                const memory = Number(navigator.deviceMemory || 0);
                const cores = Number(navigator.hardwareConcurrency || 0);
                const capableGpu = /Mali-G[567]|Adreno \\(TM\\) 7|Adreno 7/i.test(r);
                return (capableGpu || (memory >= 8 && cores >= 8)) ? 'medium' : 'low';
              }
              if (/iPhone|iPad/i.test(ua)) return 'low';
              // Retina at 3.3 MP internal is a very different job from 1080p.
              const px = innerWidth * innerHeight * Math.min(devicePixelRatio || 1, 2);
          """
              s = s[:start] + mobile_block + s[end:]
          p.write_text(s)
          main = Path('src/main.js')
          ms = main.read_text()
          old_call = "  const gov = new Governor({ allowTierChange: !explicitQ });"
          new_call = """  const mobileDevice = /Android|iPhone|iPad/i.test(navigator.userAgent || '');
            const gov = new Governor({ allowTierChange: !explicitQ, slowMs: mobileDevice ? 17.8 : 23, fastMs: mobileDevice ? 14 : 11 });"""
          if old_call in ms:
              ms = ms.replace(old_call, new_call, 1)
          elif "slowMs: mobileDevice ? 17.8" not in ms:
              raise SystemExit('Governor boot call changed unexpectedly')
          main.write_text(ms)
          pkg = Path('package.json')
          ps = pkg.read_text()
          old_build = '"build": "node tools/lintticks.mjs && vite build"'
          new_build = '"build": "node src/core/tierprobe.mjs && node tools/lintticks.mjs && vite build"'
          if old_build in ps:
              ps = ps.replace(old_build, new_build, 1)
          elif new_build not in ps:
              raise SystemExit('package build script changed unexpectedly')
          pkg.write_text(ps)
          Path('src/core/tierprobe.mjs').write_text("""import assert from 'node:assert/strict';
          import { detectTier, Governor } from './governor.js';
          const saved = Object.fromEntries(['document','navigator','innerWidth','innerHeight','devicePixelRatio'].map(k => [k, Object.getOwnPropertyDescriptor(globalThis,k)]));
          function mock({ua,memory=0,cores=0,renderer=''}) {
            globalThis.document = { createElement: () => ({ getContext: () => ({ getExtension: () => ({UNMASKED_RENDERER_WEBGL:37445}), getParameter: () => renderer }) }) };
            Object.defineProperty(globalThis,'navigator',{configurable:true,value:{userAgent:ua,deviceMemory:memory,hardwareConcurrency:cores}});
            globalThis.innerWidth=1080; globalThis.innerHeight=2400; globalThis.devicePixelRatio=2;
          }
          try {
            mock({ua:'Android 14',memory:8,cores:8}); assert.equal(detectTier(),'medium');
            mock({ua:'Android 12',memory:4,cores:4}); assert.equal(detectTier(),'low');
            mock({ua:'Android 14',renderer:'Mali-G615 MC6'}); assert.equal(detectTier(),'medium');
            mock({ua:'Windows',renderer:'NVIDIA RTX 4060'}); globalThis.devicePixelRatio=1; assert.equal(detectTier(),'high');
            const g=new Governor({slowMs:17.8,fastMs:14}); let n=0; g._apply({resize:()=>n++,events:{emit:()=>n++}});
            assert.equal(n,1); assert.equal(g.slowMs,17.8);
            console.log('Mobile tier detection + governor resize path: PASS');
          } finally {
            for (const [k,d] of Object.entries(saved)) { if(d) Object.defineProperty(globalThis,k,d); else delete globalThis[k]; }
          }
          """)
          print('Android quality/frame-pacing fixes applied')
          PY

      - name: Persist tuned Android source archive
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          zip -qr "$GITHUB_WORKSPACE/ONE-BBM-upload-light-latest.zip" .
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ONE-BBM-upload-light-latest.zip
          if ! git diff --cached --quiet; then
            git commit -m "Persist Android quality and frame pacing tuning"
            git push origin "$GITHUB_REF_NAME"
            echo "Tuned source archive committed"
          else
            echo "Source archive already contains tuning"
          fi

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --no-audit --no-fund

      - name: Validate and build web game
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm run lint --if-present
          npm run build

      - name: Runtime-smoke-test realistic player model in Chromium
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          npx playwright install chromium
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/onebbm-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true; echo "=== preview log ==="; cat /tmp/onebbm-preview.log' EXIT
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true, args: ['--use-gl=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist'] });
          const page = await browser.newPage();
          const errors = [];
          page.on('pageerror', e => errors.push(e.message));
          page.on('console', m => { if (m.type() === 'error') errors.push(m.text()); });
          try {
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.waitForFunction(() => window.__READY__ === true, null, { timeout: 90000 });
            await page.waitForFunction(() => ['loaded', 'failed'].includes(window.__ONE_BBM_CHARACTER_MODEL__?.status), null, { timeout: 45000 });
          } catch (e) {
            console.log('Runtime wait failed:', e.message);
          }
          const status = await page.evaluate(() => ({ ready: window.__READY__, model: window.__ONE_BBM_CHARACTER_MODEL__ ?? null }));
          console.log('Runtime diagnostics:', JSON.stringify(status));
          console.log('Browser errors:', JSON.stringify(errors.slice(0, 30)));
          await page.screenshot({ path: 'onebbm-runtime.png', fullPage: false, animations: 'disabled', timeout: 10000 }).catch(e => console.log('Screenshot error:', e.message));
          if (status.model?.status !== 'loaded' || (status.model?.bones ?? 0) < 15) {
            throw new Error('Model runtime verification failed; diagnostics logged above');
          }
          console.log('Realistic character model runtime smoke test PASSED');
          await browser.close();
          JS

      - name: Upload runtime screenshot for visual inspection
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ONE-BBM-V1-runtime-test
          path: ${{ env.PROJECT_DIR }}/onebbm-runtime.png
          if-no-files-found: error
          retention-days: 7

      - name: Generate Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap add android

      - name: Sync web assets
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Lock app to landscape
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          m = re.search(r'<activity\b[^>]*>', s, re.S)
          if not m:
              raise SystemExit('Main activity not found in AndroidManifest.xml')
          tag = re.sub(r'\s+android:screenOrientation="[^"]*"', '', m.group(0))
          tag = tag[:-1] + ' android:screenOrientation="landscape">'
          p.write_text(s[:m.start()] + tag + s[m.end():])
          PY

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: ./gradlew assembleDebug

      - name: Name versioned APK
        shell: bash
        run: |
          set -euo pipefail
          cp "$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/ONE-BBM-V1.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ONE-BBM-V1-APK
          path: ONE-BBM-V1.apk
          if-no-files-found: error
          retention-days: 14
