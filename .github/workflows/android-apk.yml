          assert.match(ui,/V8 RP: no story modal entry point/);
          assert.match(ui,/V8 RP: JOB action removed/);
          assert.match(ui,/V8 RP: story key removed/);
          assert.match(game,/story missions removed/);
          assert.match(game,/scripted side jobs removed/);
          console.log('V8 hard RP removal probe: 6 assertions passed');
          """)
          pkg=Path('package.json')
          data=json.loads(pkg.read_text())
          gate='node src/game/rp-hard-remove-probe.mjs'
          if gate not in data['scripts']['build']:
            data['scripts']['build']=data['scripts']['build'].replace(' && vite build',f' && {gate} && vite build')
          pkg.write_text(json.dumps(data,indent=2)+'\n')
          print('V8 RP: story/job entry points removed; direct-city free roam retained')
          # V9: replace mission, job and scripted-assault engines with inert
          # compatibility facades. Player, traffic and ordinary city interactions stay live.
          game = Path('src/game/index.js')
          gs = game.read_text()
          def replace_region(source, start_text, end_text, replacement, marker):
            a = source.find(start_text)
            b = source.find(end_text, a + len(start_text)) if a >= 0 else -1
            if a >= 0 and b > a:
              return source[:a] + replacement + source[b:]
            if marker in source:
              return source
            raise SystemExit('V9 patch anchor missing: ' + start_text)
          mission_stub = "\n".join([
            "    this.missions = {",
            "      active: false, running: false, M: null, waypoint: null, userWaypoint: null,",
            "      boy: null, boyId: this.save.active, difficulty: this.save.difficulty ?? 'normal',",
            "      save: this.save, onEnd: null, heat: this.heat,",
            "      hudObjective: () => null, hudWard: () => null, noteKill: () => {},",
            "      playBriefing: () => false, start: () => null, startCustom: () => null,",
            "      skipIntro: () => false, forceBegin: () => false, abort: () => false,",
            "      abortWith: () => false, fail: () => false, update: () => {}, dispose: () => {},",
            "    }; // V9 RP: mission engine removed from live gameplay."
          ])
          gs = replace_region(gs, "    this.missions = new MissionRunner(ctx, {", "\n\n    this.freeroam = new FreeRoam",
                              mission_stub, "V9 RP: mission engine removed from live gameplay")
          airbase_stub = "    this.airbase = { stats: null, reset: () => {}, update: () => {}, dispose: () => {} }; // V9 RP: scripted assault events removed."
          gs = replace_region(gs, "    this.airbase = new AirbaseAssault(ctx, {", "\n\n    this.jobs = new JobBoard",
                              airbase_stub, "V9 RP: scripted assault events removed")
          jobs_stub = "\n".join([
            "    this.jobs = {",
            "      lite: { active: false }, boy: null, save: this.save,",
            "      best: () => null, list: () => [], mapPoints: () => [],",
            "      refresh: () => {}, start: () => null, update: () => {}, dispose: () => {},",
            "    }; // V9 RP: side-job system removed from live gameplay."
          ])
          gs = replace_region(gs, "    this.jobs = new JobBoard(ctx, {", "\n\n    this.characters = new Characters",
                              jobs_stub, "V9 RP: side-job system removed from live gameplay")
          gs = gs.replace("    this.freeroam.boy = this.characters.boy;\n    this.jobs.boy = this.characters.boy;",
                          "    this.freeroam.boy = this.characters.boy;", 1)
          gs = gs.replace("      this.jobs.boy = this.characters.boy;\n      this.jobs.refresh(true);\n", "")
          gs = gs.replace("    this.jobs.boy = this.characters.boy;\n    this.jobs.refresh(true);\n", "")
          gs = gs.replace("    this.jobs.boy = this.characters.boy;\n", "")
          gs = gs.replace("    this.jobs.refresh(true);\n", "")
          chapter_sig = "  nextChapter(id = this.characters.activeId) {"
          gs = replace_region(gs, chapter_sig, "\n  }",
                              chapter_sig + "\n    return null; // V9 RP: no chapter progression.\n",
                              "V9 RP: no chapter progression")
          gs = gs.replace("  jobBoard() {\n    return this.jobs.list();",
                          "  jobBoard() {\n    return []; // V9 RP: no scripted job board.")
          gs = gs.replace("  getStoryOverview(id = this.characters.activeId) {",
                          "  getStoryOverview(id = this.characters.activeId) {\n    void id;\n    return null; // V9 RP: story overview removed.")
          input_sig = "  _input(ctx) {"
          input_body = input_sig + "\n    const input = ctx.input;\n    if (!input?.enabled || input.frozen || this._paused(ctx)) return;\n    if (input.pressed?.('KeyU')) this.characters.cycle(1);\n"
          gs = replace_region(gs, input_sig, "\n  }", input_body, "V9 RP: mission controls removed")
          game.write_text(gs)
          free = Path('src/game/freeroam.js')
          fs = free.read_text()
          fs = fs.replace("  _race(x, z, veh) {\n    if (this.missions.active) return false;",
